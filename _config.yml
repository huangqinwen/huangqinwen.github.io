title: Qinwen Huang
author: Qinwen (Wendy) Huang
email: qinwen.w.huang@gmail.com
description: Personal site of Qinwen (Wendy) Huang — on healthcare, data, and building things.
url: https://huangqinwen.github.io
baseurl: ""
timezone: America/Los_Angeles
substack_url: https://qinwenwhuang.substack.com

permalink: /writing/:slug/

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: note
  - scope:
      path: "_pages"
    values:
      layout: page
