<!doctype html>
<html lang="en">
  {%- include head.html -%}
  <body class="{% if page.permalink == '/' %}is-home{% endif %}">
    {%- unless page.permalink == '/' -%}
    {%- include header.html -%}
    <main class="container">
      {{ content }}
    </main>
    {%- include footer.html -%}
    {%- else -%}
    <main>
      {{ content }}
    </main>
    {%- endunless -%}
  </body>
</html>
